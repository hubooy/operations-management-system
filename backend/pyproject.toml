[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teruisi-backend"
version = "0.1.0"
description = "API-only Django backend for the TERUISI operations system"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.17",
  "psycopg[binary]==3.3.4",
  "waitress==3.0.2",
  "cryptography==46.0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "teruisi_backend*", "sales*", "erp_reference*", "finance*", "netshop*", "market*",
  "products*", "inventory*", "workflow*", "customer_service*",
  "access_control*", "ai_assistant*",
]

[tool.coverage.run]
branch = true
source = [
  "sales", "erp_reference", "finance", "netshop", "market",
  "products", "inventory", "workflow", "customer_service",
  "access_control", "ai_assistant",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
